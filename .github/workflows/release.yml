name: Build Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Determinate Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "${{ github.workspace }}/release.keystore"
          ls -lh "${{ github.workspace }}/release.keystore"
          if [ ! -s "${{ github.workspace }}/release.keystore" ]; then
            echo "ERROR: release.keystore is empty or missing - check KEYSTORE_BASE64 secret"
            exit 1
          fi

      - name: Build Signed Release APK
        env:
          TERMUX_APP_VERSION_NAME: ${{ github.ref_name }} # v prefix stripped below
          TERMUX_SPLIT_APKS_FOR_RELEASE_BUILDS: "1"
          KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          exit_on_error() { echo "$1"; exit 1; }

          # Strip 'v' prefix from tag for semver
          TERMUX_APP_VERSION_NAME="${TERMUX_APP_VERSION_NAME#v}"
          export TERMUX_APP_VERSION_NAME
          export TERMUX_APK_VERSION_TAG="${TERMUX_APP_VERSION_NAME}"
          export KEYSTORE_FILE
          export KEYSTORE_PASSWORD
          export KEY_ALIAS
          export KEY_PASSWORD
          echo "Keystore file: $KEYSTORE_FILE (exists: $(test -f "$KEYSTORE_FILE" && echo yes || echo no), size: $(stat -c%s "$KEYSTORE_FILE" 2>/dev/null || stat -f%z "$KEYSTORE_FILE" 2>/dev/null || echo unknown))"

          if ! nix develop --command ./gradlew :app:assembleRelease --no-daemon; then
            exit_on_error "Build failed for legacy app release."
          fi

          if ! nix develop --command ./gradlew :compose-app:assembleArm64Release --no-daemon; then
            exit_on_error "Build failed for Ecto arm64-v8a release."
          fi

          APK_DIR_PATH="./app/build/outputs/apk/release"
          APK_BASENAME_PREFIX="termux_${TERMUX_APP_VERSION_NAME}"
          ECTO_APK_BASENAME="ecto_${TERMUX_APP_VERSION_NAME}-arm64-v8a"
          ECTO_APK_PATH="./compose-app/build/outputs/apk/arm64/release/${ECTO_APK_BASENAME}.apk"

          echo "Validating Termux APKs"
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            if ! test -f "$APK_DIR_PATH/${APK_BASENAME_PREFIX}_$abi.apk"; then
              files_found="$(ls "$APK_DIR_PATH")"
              exit_on_error "Failed to find built APK at '$APK_DIR_PATH/${APK_BASENAME_PREFIX}_$abi.apk'. Files found: "$'\n'"$files_found"
            fi
          done

          echo "Validating Ecto APK"
          if ! test -f "$ECTO_APK_PATH"; then
            files_found="$(ls ./compose-app/build/outputs/apk/arm64/release)"
            exit_on_error "Failed to find built APK at '$ECTO_APK_PATH'. Files found: "$'\n'"$files_found"
          fi

          echo "Generating sha256sums file"
          if ! (cd "$APK_DIR_PATH"; sha256sum \
            "${APK_BASENAME_PREFIX}_arm64-v8a.apk" \
            "${APK_BASENAME_PREFIX}_armeabi-v7a.apk" \
            "${APK_BASENAME_PREFIX}_x86_64.apk" \
            "${APK_BASENAME_PREFIX}_x86.apk" \
            > "${APK_BASENAME_PREFIX}_sha256sums"); then
            exit_on_error "Generate sha256sums failed for release."
          fi

          echo "Verifying APK signatures (fail if unsigned)"
          export APK_DIR_PATH
          export ECTO_APK_PATH
          # Expanded by the nested Nix shell.
          # shellcheck disable=SC2016
          if ! nix develop --command bash -c '
            set -euo pipefail
            apksigner=""
            for candidate in "$ANDROID_HOME"/build-tools/*/apksigner; do
              [ -x "$candidate" ] || continue
              apksigner="$candidate"
            done
            if [ -z "$apksigner" ]; then
              echo "apksigner not found in Android SDK"
              exit 1
            fi
            for apk in \
              "$APK_DIR_PATH/${APK_BASENAME_PREFIX}_arm64-v8a.apk" \
              "$APK_DIR_PATH/${APK_BASENAME_PREFIX}_armeabi-v7a.apk" \
              "$APK_DIR_PATH/${APK_BASENAME_PREFIX}_x86_64.apk" \
              "$APK_DIR_PATH/${APK_BASENAME_PREFIX}_x86.apk" \
              "$ECTO_APK_PATH"; do
              echo "Verifying $apk"
              "$apksigner" verify --verbose "$apk"
            done
          '; then
            exit_on_error "APK signature verification failed"
          fi

          echo "APK_DIR_PATH=$APK_DIR_PATH" >> $GITHUB_ENV
          echo "APK_BASENAME_PREFIX=$APK_BASENAME_PREFIX" >> $GITHUB_ENV
          echo "ECTO_APK_BASENAME=$ECTO_APK_BASENAME" >> $GITHUB_ENV
          echo "ECTO_APK_PATH=$ECTO_APK_PATH" >> $GITHUB_ENV

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_BASENAME_PREFIX }}_arm64-v8a
          path: ${{ env.APK_DIR_PATH }}/${{ env.APK_BASENAME_PREFIX }}_arm64-v8a.apk
          retention-days: 14

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_BASENAME_PREFIX }}_armeabi-v7a
          path: ${{ env.APK_DIR_PATH }}/${{ env.APK_BASENAME_PREFIX }}_armeabi-v7a.apk
          retention-days: 14

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_BASENAME_PREFIX }}_x86_64
          path: ${{ env.APK_DIR_PATH }}/${{ env.APK_BASENAME_PREFIX }}_x86_64.apk
          retention-days: 14

      - name: Upload x86 APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_BASENAME_PREFIX }}_x86
          path: ${{ env.APK_DIR_PATH }}/${{ env.APK_BASENAME_PREFIX }}_x86.apk
          retention-days: 14

      - name: Upload sha256sums
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_BASENAME_PREFIX }}_sha256sums
          path: ${{ env.APK_DIR_PATH }}/${{ env.APK_BASENAME_PREFIX }}_sha256sums
          retention-days: 14

      - name: Upload Ecto arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ECTO_APK_BASENAME }}
          path: ${{ env.ECTO_APK_PATH }}
          retention-days: 14

