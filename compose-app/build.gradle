import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jlleitschuh.gradle.ktlint'
    id 'io.gitlab.arturbosch.detekt'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            def buildTypeName = variant.buildType
            def nameTag = buildTypeName == "debug" ? "debug" : "release"
            def apkVersionTag = System.getenv("TERMUX_APK_VERSION_TAG") ?: ""
            def packageVariant = System.getenv("TERMUX_PACKAGE_VARIANT") ?: "apt-android-7"
            def filename = "ecto_" + (apkVersionTag ? apkVersionTag : packageVariant + "-" + nameTag) + ".apk"
            output.outputFileName.set(filename)
        }
    }
}

android {
    namespace 'com.mrndtvndv.term'
    compileSdk project.properties.compileSdkVersion.toInteger()
    ndkVersion = System.getenv("JITPACK_NDK_VERSION") ?: project.properties.ndkVersion

    defaultConfig {
        applicationId "com.mrndtvndv.term"
        minSdk project.properties.minSdkVersion.toInteger()
        targetSdk project.properties.targetSdkVersion.toInteger()
        versionCode 7
        versionName "3.3.0"
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }



    buildFeatures {
        compose true
    }



    packaging {
        resources {
            // Exclude signature files from Bouncy Castle to avoid packaging/signing errors
            excludes += [
                'META-INF/INDEX.LIST',
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/ASL2.0',
                'META-INF/*.kotlin_module'
            ]
        }
    }

    signingConfigs {
        release {
            def keystoreFile = System.getenv("KEYSTORE_FILE")
            if (keystoreFile && file(keystoreFile).exists()) {
                storeFile file(keystoreFile)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            jniDebuggable true
            ndk {
                abiFilters 'arm64-v8a'
            }
            packaging {
                jniLibs {
                    keepDebugSymbols += ['**/libtermux-ghostty.so']
                }
            }
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            def keystoreFile = System.getenv("KEYSTORE_FILE")
            if (keystoreFile && file(keystoreFile).exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_17
        freeCompilerArgs.add("-opt-in=kotlin.RequiresOptIn")
    }
}

detekt {
    config = files("${rootDir}/config/detekt/detekt.yml")
    baseline = file("detekt-baseline.xml")
    buildUponDefaultConfig = true
}

ktlint {
    version.set("1.3.1")
}

dependencies {
    implementation project(':terminal-view')
    implementation project(':terminal-emulator')
    implementation project(':termux-shared')
    implementation 'com.google.android.material:material:1.14.0'

    // Compose & Activity-Compose
    def composeBom = platform('androidx.compose:compose-bom:2026.06.01')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.11.0'
    implementation 'androidx.window:window:1.5.1'

    // Explicitly add modern Bouncy Castle for Android compat
    implementation 'org.bouncycastle:bcprov-jdk18on:1.85'
    
    // Conscrypt for faster & secure cryptographic operations on Android
    implementation 'org.conscrypt:conscrypt-android:2.6.1'

    // Navigation 3
    implementation 'androidx.navigation3:navigation3-runtime:1.1.4'
    implementation 'androidx.navigation3:navigation3-ui:1.1.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-navigation3:2.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0'

    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"

    testImplementation "junit:junit:4.13.2"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0"
}
