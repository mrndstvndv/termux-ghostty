name: Build Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Determinate Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "${{ github.workspace }}/release.keystore"
          ls -lh "${{ github.workspace }}/release.keystore"
          if [ ! -s "${{ github.workspace }}/release.keystore" ]; then
            echo "ERROR: release.keystore is empty or missing - check KEYSTORE_BASE64 secret"
            exit 1
          fi

      - name: Build Signed Release APK
        env:
          TERMUX_APP_VERSION_NAME: ${{ github.ref_name }} # v prefix stripped below
          TERMUX_SPLIT_APKS_FOR_RELEASE_BUILDS: "1"
          KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          exit_on_error() { echo "$1"; exit 1; }

          # Strip 'v' prefix from tag for semver
          TERMUX_APP_VERSION_NAME="${TERMUX_APP_VERSION_NAME#v}"
          export TERMUX_APP_VERSION_NAME
          export TERMUX_APK_VERSION_TAG="${TERMUX_APP_VERSION_NAME}"
          export KEYSTORE_FILE
          export KEYSTORE_PASSWORD
          export KEY_ALIAS
          export KEY_PASSWORD
          echo "Keystore file: $KEYSTORE_FILE (exists: $(test -f "$KEYSTORE_FILE" && echo yes || echo no), size: $(stat -c%s "$KEYSTORE_FILE" 2>/dev/null || stat -f%z "$KEYSTORE_FILE" 2>/dev/null || echo unknown))"

          if ! nix develop --command ./gradlew assembleRelease --no-daemon; then
            exit_on_error "Build failed for release."
          fi

          APK_DIR_PATH="./app/build/outputs/apk/release"
          APK_BASENAME_PREFIX="termux_${TERMUX_APP_VERSION_NAME}"

          echo "Validating APKs"
          for abi in universal arm64-v8a armeabi-v7a x86_64 x86; do
            if ! test -f "$APK_DIR_PATH/${APK_BASENAME_PREFIX}_$abi.apk"; then
              files_found="$(ls "$APK_DIR_PATH")"
              exit_on_error "Failed to find built APK at '$APK_DIR_PATH/${APK_BASENAME_PREFIX}_$abi.apk'. Files found: "$'\n'"$files_found"
            fi
          done

          echo "Generating sha25sums file"
          if ! (cd "$APK_DIR_PATH"; sha256sum \
            "${APK_BASENAME_PREFIX}_universal.apk" \
            "${APK_BASENAME_PREFIX}_arm64-v8a.apk" \
            "${APK_BASENAME_PREFIX}_armeabi-v7a.apk" \
            "${APK_BASENAME_PREFIX}_x86_64.apk" \
            "${APK_BASENAME_PREFIX}_x86.apk" \
            > "${APK_BASENAME_PREFIX}_sha256sums"); then
            exit_on_error "Generate sha25sums failed for release."
          fi

          echo "Verifying APK signatures (fail if unsigned)"
          if nix develop --command bash -c "command -v apksigner" >/dev/null 2>&1; then
            for apk in "$APK_DIR_PATH"/*.apk; do
              echo "Verifying $apk"
              nix develop --command apksigner verify --verbose "$apk" || exit_on_error "Signature verification failed for $apk (NOT SIGNED - will cause INSTALL_PARSE_FAILED_NO_CERTIFICATES)"
            done
          else
            for apk in "$APK_DIR_PATH"/*.apk; do
              echo "Verifying $apk via jarsigner"
              if ! jarsigner -verify "$apk" 2>&1 | grep -q "jar verified"; then
                exit_on_error "Signature verification failed for $apk"
              fi
            done
          fi
          # Also verify compose-app APKs if built via assembleRelease (fat build)
          for apk in ./compose-app/build/outputs/apk/*/release/*.apk; do
            [ -f "$apk" ] || continue
            echo "Verifying compose $apk"
            if nix develop --command bash -c "command -v apksigner" >/dev/null 2>&1; then
              nix develop --command apksigner verify --verbose "$apk" || exit_on_error "Signature verification failed for $apk"
            fi
          done

          echo "APK_DIR_PATH=$APK_DIR_PATH" >> $GITHUB_ENV
          echo "APK_BASENAME_PREFIX=$APK_BASENAME_PREFIX" >> $GITHUB_ENV

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_BASENAME_PREFIX }}_universal
          path: ${{ env.APK_DIR_PATH }}/${{ env.APK_BASENAME_PREFIX }}_universal.apk
          retention-days: 14

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_BASENAME_PREFIX }}_arm64-v8a
          path: ${{ env.APK_DIR_PATH }}/${{ env.APK_BASENAME_PREFIX }}_arm64-v8a.apk
          retention-days: 14

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_BASENAME_PREFIX }}_armeabi-v7a
          path: ${{ env.APK_DIR_PATH }}/${{ env.APK_BASENAME_PREFIX }}_armeabi-v7a.apk
          retention-days: 14

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_BASENAME_PREFIX }}_x86_64
          path: ${{ env.APK_DIR_PATH }}/${{ env.APK_BASENAME_PREFIX }}_x86_64.apk
          retention-days: 14

      - name: Upload x86 APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_BASENAME_PREFIX }}_x86
          path: ${{ env.APK_DIR_PATH }}/${{ env.APK_BASENAME_PREFIX }}_x86.apk
          retention-days: 14

      - name: Upload sha256sums
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_BASENAME_PREFIX }}_sha256sums
          path: ${{ env.APK_DIR_PATH }}/${{ env.APK_BASENAME_PREFIX }}_sha256sums
          retention-days: 14
