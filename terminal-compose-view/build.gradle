import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jlleitschuh.gradle.ktlint'
    id 'io.gitlab.arturbosch.detekt'
    id 'maven-publish'
}

android {
    namespace 'com.termux.terminal.compose'
    compileSdk project.properties.compileSdkVersion.toInteger()

    defaultConfig {
        minSdk project.properties.minSdkVersion.toInteger()
        targetSdk project.properties.targetSdkVersion.toInteger()
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose true
    }

    buildTypes {
        release {
            minifyEnabled false
            consumerProguardFiles 'consumer-rules.pro'
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    publishing {
        multipleVariants {
            withSourcesJar()
            withJavadocJar()
            allVariants()
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_17
        freeCompilerArgs.add("-opt-in=kotlin.RequiresOptIn")
    }
}

detekt {
    config = files("${rootDir}/config/detekt/detekt.yml")
    baseline = file("detekt-baseline.xml")
    buildUponDefaultConfig = true
}

ktlint {
    version.set("1.3.1")
}

dependencies {
    // Compose APIs appear in the public API surface (composable entry point,
    // DrawScope-based effects), so these are `api` dependencies.
    def composeBom = platform('androidx.compose:compose-bom:2026.06.01')
    api composeBom
    api 'androidx.compose.ui:ui'
    api 'androidx.compose.ui:ui-text'
    api 'androidx.compose.ui:ui-graphics'
    api 'androidx.compose.foundation:foundation'

    // Internal implementation detail: character-width tables and text-style
    // encoding from the emulator core. No terminal-emulator type appears in the
    // public API of this library.
    implementation project(':terminal-emulator')

    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.10"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0"

    androidTestImplementation composeBom
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.default
                groupId = 'com.termux'
                artifactId = 'terminal-compose-view'
                version = '0.1.0'
            }
        }
    }
}
