buildscript {
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:9.2.1"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.10"
        classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:2.4.10"
        classpath "org.jetbrains.kotlin:kotlin-serialization:2.4.10"
    }
}

plugins {
    id 'org.jlleitschuh.gradle.ktlint' version '12.2.0' apply false
    id 'io.gitlab.arturbosch.detekt' version '1.23.8' apply false
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
    
    // Resolve global dependency conflicts
    configurations.all {
        resolutionStrategy {
            // Force single version of Guava Android variant to prevent JVM/Android API mismatch
            // Using 33.6.0-android since MoreFiles was added to the Android flavor in 33.4.0+
            force 'com.google.guava:guava:33.6.0-android'
            
            // Handle Conscrypt/Bouncy Castle version conflicts
            force 'org.bouncycastle:bcprov-jdk18on:1.78'
            force 'org.bouncycastle:bcpkix-jdk18on:1.78'
        }
    }
}
