buildscript {
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:9.2.1"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.10"
        classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:2.4.10"
        classpath "org.jetbrains.kotlin:kotlin-serialization:2.4.10"
    }
}

plugins {
    id 'org.jlleitschuh.gradle.ktlint' version '12.2.0' apply false
    id 'io.gitlab.arturbosch.detekt' version '1.23.8' apply false
}

ext.termuxSupportedAbis = ['arm64-v8a', 'armeabi-v7a', 'x86_64', 'x86']
ext.resolveTermuxAbis = {
    def configuredValue = rootProject.findProperty('termuxTargetAbis') ?: System.getenv('TERMUX_TARGET_ABIS')
    if (configuredValue) {
        def normalizedValue = configuredValue.toString().trim()
        if (normalizedValue == 'all') return rootProject.ext.termuxSupportedAbis

        def configuredAbis = normalizedValue.split(',')*.trim().findAll { it }.unique()
        def unsupportedAbis = configuredAbis - rootProject.ext.termuxSupportedAbis
        if (configuredAbis.isEmpty() || unsupportedAbis) {
            throw new GradleException(
                "Unsupported termuxTargetAbis value '${configuredValue}'. " +
                    "Expected a comma-separated list of: ${rootProject.ext.termuxSupportedAbis.join(', ')}"
            )
        }
        return configuredAbis
    }

    def taskNames = rootProject.gradle.startParameter.taskNames.collect { it.toLowerCase(Locale.ROOT) }
    def requestedAbis = []
    if (taskNames.any { it.contains('arm64') }) requestedAbis << 'arm64-v8a'
    if (taskNames.any { it.contains('armeabi') }) requestedAbis << 'armeabi-v7a'
    if (taskNames.any { it.contains('x86_64') }) requestedAbis << 'x86_64'
    if (taskNames.any { it.contains('x86') && !it.contains('x86_64') }) requestedAbis << 'x86'

    return requestedAbis ?: rootProject.ext.termuxSupportedAbis
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
    
    // Resolve global dependency conflicts
    configurations.all {
        resolutionStrategy {
            // Force single version of Guava Android variant to prevent JVM/Android API mismatch
            // Using 33.6.0-android since MoreFiles was added to the Android flavor in 33.4.0+
            force 'com.google.guava:guava:33.6.0-android'
        }
    }
}
