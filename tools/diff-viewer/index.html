<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:;">
  <title>Diff Viewer</title>
  <style>
    :root {
      --diffs-font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      --diffs-header-active-bg: rgba(255, 255, 255, 0.08);
      --diffs-header-top: 0px;
      color-scheme: light dark;
    }
    :root[data-theme="light"], [data-theme="light"] {
      --diffs-header-active-bg: rgba(0, 0, 0, 0.06);
    }
    * {
      box-sizing: border-box;
      touch-action: pan-x pan-y;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      /* Transparent: the host (Compose) owns the page chrome color. */
      background-color: transparent;
      color: #e0e0e0;
      font-family: var(--diffs-font-family);
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
      touch-action: pan-x pan-y;
      overflow-x: hidden;
    }
    #diff-root {
      width: 100%;
      max-width: 100vw;
      min-height: 100%;
      padding: 8px 0 max(56px, env(safe-area-inset-bottom, 56px)) 0;
      touch-action: pan-x pan-y;
    }
    .file-diff-item {
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      touch-action: pan-x pan-y;
      transition: margin-bottom 0.15s ease;
    }
    .file-diff-item > * {
      max-width: 100%;
    }
    .file-diff-item:last-child {
      border-bottom: none;
    }
    .file-diff-item[data-collapsed="true"] {
      margin-bottom: 4px !important;
    }
    .file-diff-item[data-collapsed="true"] .diff-empty-notice {
      display: none !important;
    }
    .diff-collapse-chevron {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      margin-right: 6px;
      color: var(--diffs-fg-number, #888);
      flex-shrink: 0;
      vertical-align: middle;
      cursor: pointer;
    }
    .diff-collapse-chevron svg {
      display: block;
      width: 13px;
      height: 13px;
      transition: transform 0.18s cubic-bezier(0.4, 0, 0.2, 1);
      transform: rotate(0deg);
    }
    .file-diff-item[data-collapsed="true"] .diff-collapse-chevron svg,
    [data-collapsed="true"] .diff-collapse-chevron svg,
    .diff-collapse-chevron[data-collapsed="true"] svg {
      transform: rotate(-90deg);
    }
    /* Touch scroll optimization */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(128, 128, 128, 0.3);
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <div id="diff-root"></div>
  <script type="module" src="/src/index.ts"></script>
</body>
</html>
